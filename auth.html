<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In | 4Kingdom Podcast</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --blue: #0A4DBF; --blue-dark: #083A90; --blue-accent: #DCE8FF;
  --gray-light: #F5F5F5; --gray-mid: #E8E8E8;
  --text: #1D1D1D; --text-muted: #5A5A6A; --white: #FFFFFF;
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; color: var(--text); background: var(--gray-light); min-height: 100vh; display: flex; flex-direction: column; }
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }
.auth-header { background: var(--white); border-bottom: 1px solid var(--gray-mid); padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: center; }
.auth-logo { display: flex; align-items: center; gap: 0.75rem; font-weight: 800; font-size: 1.2rem; color: var(--blue); }
.auth-logo-icon { width: 36px; height: 36px; background: var(--blue); color: white; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 0.875rem; }
.auth-main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
.auth-card { background: var(--white); border-radius: 20px; border: 1px solid var(--gray-mid); padding: 2.5rem; width: 100%; max-width: 440px; box-shadow: 0 4px 24px rgba(10,77,191,0.08); }
.auth-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.5rem; text-align: center; }
.auth-sub { font-size: 0.9rem; color: var(--text-muted); text-align: center; margin-bottom: 2rem; }
.tabs { display: flex; background: var(--gray-light); border-radius: 8px; padding: 4px; margin-bottom: 1.75rem; }
.tab-btn { flex: 1; padding: 0.625rem; background: none; border: none; cursor: pointer; font-size: 0.875rem; font-weight: 600; color: var(--text-muted); border-radius: 6px; transition: all 0.15s; font-family: inherit; }
.tab-btn.active { background: var(--white); color: var(--blue); box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
.form-group { margin-bottom: 1rem; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.form-label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.375rem; }
.form-input { width: 100%; padding: 0.75rem 1rem; border: 2px solid var(--gray-mid); border-radius: 8px; font-size: 1rem; color: var(--text); background: var(--white); transition: border-color 0.15s; font-family: inherit; }
.form-input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(10,77,191,0.1); }
.form-forgot { display: block; text-align: right; font-size: 0.8rem; margin-top: 0.3rem; }
.btn-submit { width: 100%; padding: 0.875rem; background: var(--blue); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; font-family: inherit; transition: background 0.15s; margin-top: 0.5rem; }
.btn-submit:hover { background: var(--blue-dark); }
.btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
.divider { display: flex; align-items: center; gap: 1rem; margin: 1.5rem 0; color: var(--text-muted); font-size: 0.8rem; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--gray-mid); }
.oauth-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
.oauth-btn { display: flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.75rem; background: var(--white); border: 1.5px solid var(--gray-mid); border-radius: 8px; font-size: 0.875rem; font-weight: 500; cursor: pointer; font-family: inherit; transition: all 0.15s; color: var(--text); }
.oauth-btn:hover { border-color: var(--blue); background: var(--blue-accent); }
.oauth-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
.alert { padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.875rem; margin-bottom: 1rem; display: none; }
.alert.visible { display: block; }
.alert-error { background: #FEF2F2; border: 1px solid #FECACA; color: #DC2626; }
.alert-success { background: #F0FDF4; border: 1px solid #86EFAC; color: #15803D; }
.auth-footer { text-align: center; padding: 1.5rem; font-size: 0.8rem; color: var(--text-muted); }
@media (max-width: 480px) {
  .auth-card { padding: 1.5rem; }
  .form-row { grid-template-columns: 1fr; }
  .oauth-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header class="auth-header">
  <a href="index.html" class="auth-logo">
    <div class="auth-logo-icon">4K</div>
    4Kingdom Podcast
  </a>
</header>
<main class="auth-main">
  <div class="auth-card">
    <h1 class="auth-title">Welcome to 4Kingdom</h1>
    <p class="auth-sub">Join our community or sign in to your account.</p>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('signin')">Sign In</button>
      <button class="tab-btn" onclick="switchTab('signup')">Create Account</button>
    </div>
    <div id="alertBox" class="alert"></div>

    <form id="signinForm" onsubmit="handleSignIn(event)">
      <div class="form-group">
        <label class="form-label" for="siEmail">Email Address</label>
        <input class="form-input" type="email" id="siEmail" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label class="form-label" for="siPassword">Password</label>
        <input class="form-input" type="password" id="siPassword" placeholder="Your password" required />
        <a href="#" class="form-forgot" onclick="forgotPassword(event)">Forgot password?</a>
      </div>
      <button type="submit" class="btn-submit" id="siBtn">Sign In</button>
    </form>

    <form id="signupForm" style="display:none;" onsubmit="handleSignUp(event)">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="suFirst">First Name</label>
          <input class="form-input" type="text" id="suFirst" placeholder="First name" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="suLast">Last Name</label>
          <input class="form-input" type="text" id="suLast" placeholder="Last name" required />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="suEmail">Email Address</label>
        <input class="form-input" type="email" id="suEmail" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label class="form-label" for="suPassword">Password</label>
        <input class="form-input" type="password" id="suPassword" placeholder="At least 8 characters" required />
      </div>
      <div class="form-group">
        <label class="form-label" for="suConfirm">Confirm Password</label>
        <input class="form-input" type="password" id="suConfirm" placeholder="Repeat your password" required />
      </div>
      <button type="submit" class="btn-submit" id="suBtn">Create Account</button>
    </form>

    <div class="divider">or continue with</div>
    <div class="oauth-grid">
      <button class="oauth-btn" onclick="oAuth('google')">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        Google
      </button>
      <button class="oauth-btn" onclick="oAuth('apple')">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.7 9.05 7.4c1.39.07 2.36.74 3.18.8 1.22-.24 2.39-.93 3.6-.84 1.54.12 2.69.72 3.46 1.83-3.15 1.9-2.4 5.77.48 6.9-.57 1.5-1.3 2.97-2.72 4.19zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
        Apple
      </button>
      <button class="oauth-btn" onclick="oAuth('facebook')">
        <svg viewBox="0 0 24 24" fill="#1877F2" aria-hidden="true"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
        Facebook
      </button>
      <button class="oauth-btn" onclick="oAuth('discord')">
        <svg viewBox="0 0 24 24" fill="#5865F2" aria-hidden="true"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
        Discord
      </button>
    </div>
  </div>
</main>
<footer class="auth-footer">
  "Do not fear, for I am with you." — Isaiah 41:10
</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = 'https://ufteogqsrddeqsiytqiu.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_59MKDhWptLo1tjw7Djy83A_EZBN3c0T';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

db.auth.getSession().then(({ data: { session } }) => { if (session) go('dashboard.html'); });

function go(page) { window.location.href = page; }

function switchTab(tab) {
  const si = tab === 'signin';
  document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', si ? i === 0 : i === 1));
  document.getElementById('signinForm').style.display = si ? '' : 'none';
  document.getElementById('signupForm').style.display = si ? 'none' : '';
  clearAlert();
}

function showAlert(msg, type) {
  const el = document.getElementById('alertBox');
  el.textContent = msg;
  el.className = 'alert alert-' + type + ' visible';
}
function clearAlert() { document.getElementById('alertBox').className = 'alert'; }

async function handleSignIn(e) {
  e.preventDefault();
  const btn = document.getElementById('siBtn');
  btn.disabled = true; btn.textContent = 'Signing in...';
  clearAlert();
  const { error } = await db.auth.signInWithPassword({
    email: document.getElementById('siEmail').value.trim(),
    password: document.getElementById('siPassword').value
  });
  if (error) {
    showAlert(error.message === 'Invalid login credentials' ? 'Incorrect email or password.' : error.message, 'error');
    btn.disabled = false; btn.textContent = 'Sign In';
  } else { go('dashboard.html'); }
}

async function handleSignUp(e) {
  e.preventDefault();
  const btn = document.getElementById('suBtn');
  const first = document.getElementById('suFirst').value.trim();
  const last = document.getElementById('suLast').value.trim();
  const email = document.getElementById('suEmail').value.trim();
  const pass = document.getElementById('suPassword').value;
  const confirm = document.getElementById('suConfirm').value;
  clearAlert();
  if (pass !== confirm) { showAlert('Passwords do not match.', 'error'); return; }
  if (pass.length < 8) { showAlert('Password must be at least 8 characters.', 'error'); return; }
  btn.disabled = true; btn.textContent = 'Creating account...';
  const { error } = await db.auth.signUp({ email, password: pass, options: { data: { first_name: first, last_name: last } } });
  if (error) {
    showAlert(error.message, 'error');
    btn.disabled = false; btn.textContent = 'Create Account';
  } else {
    showAlert('Account created! Check your email to confirm it, then sign in.', 'success');
    btn.disabled = false; btn.textContent = 'Create Account';
  }
}

async function oAuth(provider) {
  const base = window.location.href.replace('auth.html', '');
  const { error } = await db.auth.signInWithOAuth({ provider, options: { redirectTo: base + 'dashboard.html' } });
  if (error) showAlert('Could not connect to ' + provider + '. Enable it in your Supabase dashboard under Authentication > Providers.', 'error');
}

async function forgotPassword(e) {
  e.preventDefault();
  const email = document.getElementById('siEmail').value.trim();
  if (!email) { showAlert('Enter your email above first, then click Forgot Password.', 'error'); return; }
  const { error } = await db.auth.resetPasswordForEmail(email);
  if (error) showAlert(error.message, 'error');
  else showAlert('Password reset email sent. Check your inbox.', 'success');
}
</script>
</body>
</html>
